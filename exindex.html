<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="FenorCRY.png">
    
    <title>Fenor | Transmitidor Lamentable</title>
    
    <meta name="description" content="Hub de Fenor, redes sociales, sorteos y contacto.">
    <meta property="og:title" content="Fenor">
    <meta property="og:description" content="Transmisiones casi nunca pero ahí va.">
    <meta property="og:image" content="https://donfenor.github.io/stream/FenorCRY.png">
    <meta property="og:url" content="https://donfenor.github.io/stream/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fenor">
    <meta name="twitter:description" content="Transmisiones casi nunca pero ahí va.">
    <meta name="twitter:image" content="https://donfenor.github.io/stream/FenorCRY.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
        <style>
        body {
            background-color: #0d0d0d;
            color: white;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .reveal { opacity: 0; animation: fadeInUp 0.8s ease forwards; }
        .pic-anim { animation-delay: 0.2s; }
        .name-anim { animation-delay: 0.4s; }
        .sub-anim { animation-delay: 0.5s; }
        .btn-anim { animation-delay: 0.6s; }
        .giveaway-anim { animation-delay: 0.7s; }
        .descent-anim { animation-delay: 0.8s; }
        .icons-anim { animation-delay: 1s; }
        .sponsor-anim { animation-delay: 1.2s; }

        .profile-pic {
            width: 100px; height: 100px;
            border-radius: 50%; border: 3px solid #1a1a1a;
            margin-bottom: 15px; object-fit: cover;
        }

        h1 { margin: 0; font-size: 1.8rem; font-weight: 700; width: 100%; }
        .subtitle { color: #888; margin-bottom: 30px; width: 100%; }

        /* Contenedor unificado para simetría perfecta */
        .btn-container {
            width: 100%;
            max-width: 380px;
            margin-bottom: 15px; /* Espaciado idéntico entre bloques */
            display: flex;
            justify-content: center;
        }

        .contact-button {
            background-color: #1a1a1a;
            width: 100%; 
            max-width: 320px;
            padding: 16px 20px; 
            border-radius: 14px;
            display: flex; 
            justify-content: space-between;
            align-items: center; 
            text-decoration: none;
            color: white; 
            font-weight: 600;
            border: 1px solid #222;
            transition: 0.2s;
            cursor: pointer; 
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .contact-button:hover {
            transform: translateY(-3px);
            background-color: #252525;
        }

        /* RULETA - SHAKE ROJO */
        .giveaway-button {
            background: linear-gradient(45deg, #4d0000, #000000) !important;
            border: 1px solid #700000 !important;
            max-width: 380px;
        }

        @keyframes shake-ruleta {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .giveaway-button:hover {
            animation: shake-ruleta 0.3s infinite !important;
            border-color: #ff3333 !important;
        }

        /* DESCENSO - VIBRACIÓN VIOLETA AGRESIVA */
        .descent-button {
            background: linear-gradient(45deg, #1a0029, #000000) !important;
            border: 1px solid #52057b !important;
            color: #bc6ff1 !important;
            max-width: 380px;
        }

        @keyframes vibration-violet {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(-3px, -2px); }
            60% { transform: translate(3px, 2px); }
            80% { transform: translate(3px, -2px); }
            100% { transform: translate(0); }
        }

        .descent-button:hover {
            animation: vibration-violet 0.1s infinite !important;
            background: linear-gradient(45deg, #310a47, #0d0d0d) !important;
            border-color: #bc6ff1 !important;
            color: white !important;
            box-shadow: 0 0 15px rgba(188, 111, 241, 0.5);
        }

        .social-icons { display: flex; gap: 20px; margin: 10px auto 25px auto; justify-content: center; width: 100%; }
        .social-icons a { color: white; font-size: 1.8rem; transition: 0.3s; text-decoration: none; }
        .social-icons a:hover { transform: scale(1.2) translateY(-3px); }
        .fa-twitch:hover { color: #9146FF; }
        .fa-youtube:hover { color: #FF0000; }
        .fa-instagram:hover { color: #E1306C; }
        .fa-tiktok:hover { color: #00f2ea; }
        .fa-x-twitter:hover { color: #ffffff; }
        .fa-discord:hover { color: #5865F2; }

        .sponsor-section { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
        .sponsor-title { font-size: 0.6rem; text-transform: uppercase; color: #444; margin-bottom: 12px; letter-spacing: 2px; }
        .sponsor-img { width: 80px !important; opacity: 0.5; transition: 0.3s; filter: grayscale(1); }
        .sponsor-img:hover { opacity: 1; filter: grayscale(0); transform: scale(1.05); }

        @media (max-width: 480px) { .contact-button, .giveaway-button, .descent-button { width: 95%; } }
    </style>
</head>
<body>

    <img src="FenorCRY.png" alt="Fenor" class="profile-pic reveal pic-anim">
    <h1 class="reveal name-anim">Fenor</h1>
    <p class="subtitle reveal sub-anim">Transmitidor lamentable</p>

    <div class="btn-container reveal btn-anim">
        <button onclick="copiarCorreo()" class="contact-button">
            <span id="texto-contacto">Contacto</span>
            <i class="fa-regular fa-envelope" id="icono-contacto"></i>
        </button>
    </div>

    <div class="btn-container reveal giveaway-anim">
        <a href="https://donfenor.github.io/sorteo/" target="_blank" class="contact-button giveaway-button">
            <span>La Ruleta del Infortunio</span>
            <i class="fa-solid fa-gift"></i>
        </a>
    </div>

    <div class="btn-container reveal descent-anim">
        <a href="https://donfenor.github.io/descenso/" target="_blank" class="contact-button descent-button">
            <span>El Descenso</span>
            <i class="fa-solid fa-skull"></i>
        </a>
    </div>

    <div class="social-icons reveal icons-anim">
        <a href="https://www.twitch.tv/fenor" target="_blank"><i class="fa-brands fa-twitch"></i></a>
        <a href="https://www.youtube.com/@FenorVOD" target="_blank"><i class="fa-brands fa-youtube"></i></a>
        <a href="https://www.instagram.com/donfenor/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.tiktok.com/@donfenor" target="_blank"><i class="fa-brands fa-tiktok"></i></a> 
        <a href="https://x.com/DonFenor" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://discord.gg/qF7S2wAMwj" target="_blank"><i class="fa-brands fa-discord"></i></a>
    </div>

    <div class="sponsor-section reveal sponsor-anim">
        <span class="sponsor-title">Patrocinadores</span>
        <a href="https://www.instant-gaming.com/?igr=fenor" target="_blank">
            <img src="allkeyshop.png" alt="allkeyshop" class="sponsor-img">
        </a>
    </div>

    <script>
    function copiarCorreo() {
        const email = "fenorbusiness@gmail.com"; 
        navigator.clipboard.writeText(email);
        const texto = document.getElementById("texto-contacto");
        const icono = document.getElementById("icono-contacto");
        texto.innerText = "¡Copiado!";
        icono.className = "fa-solid fa-check";
        icono.style.color = "#00f2ea";
        setTimeout(() => {
            texto.innerText = "Contacto";
            icono.className = "fa-regular fa-envelope";
            icono.style.color = "white";
        }, 2000);
    }
    </script>
</body>
</html>
