<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fenor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{
  margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

body{
  background:#050505;
  color:#ffffff;
  font-family:'Courier Prime',monospace;
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:60px 32px 80px;
  overflow-x: hidden;
  animation: bodyFadeIn 1.2s ease forwards;
}

@keyframes bodyFadeIn {
  to { background: #080808; }
}

body::before{
  content:'';
  position:fixed;inset:0;
  width:100vw;
  height:100vh;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity:0.04;
  pointer-events:none;
  z-index:999;
  mix-blend-mode: screen;
  transform: translateZ(0);
  backface-visibility: hidden;
  will-change: transform;
}

.hub{
  width:100%;
  max-width:560px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}

/* HEADER - ENTRADA CINEMÁTICA */
.top{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  width:100%;
  margin-bottom:4px;
}

.identity{text-align:center;}
.name{
  font-family:'UnifrakturMaguntia',cursive;
  font-size:72px;
  line-height:1;
  color:#fff;
  letter-spacing: 0.05em;
  filter: blur(12px);
  opacity: 0;
  transform: scale(0.92);
  animation: epicTitleReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  animation-delay: 0.1s;
}

@keyframes epicTitleReveal {
  to {
    filter: blur(0);
    opacity: 1;
    transform: scale(1);
    letter-spacing: 0em;
  }
}

.tagline{
  font-size:13px;
  letter-spacing:0.12em;
  color:#888;
  font-style:italic;
  margin-top:3px;
  opacity: 0;
  transform: translateY(4px);
  animation: subtitleReveal 1s ease forwards;
  animation-delay: 0.8s;
}

@keyframes subtitleReveal {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* PIZZA SOCIALS */
.pizza-wrap{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:2px;
}

.pizza-container{
  position:relative;
  width:320px;
  height:320px;
}

.pizza-svg{
  width:320px;
  height:320px;
  background: transparent;
  display: block;
}

.slice {
  transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
  transform-origin: 100px 100px;
  opacity: 0;
}

.slice path.bg{
  transition: fill 0.15s, stroke 0.15s;
}

.slice path.icon-path{
  transition: fill 0.15s;
  pointer-events:none;
}

/* center circle */
.center-circle{
  fill:#0d0d0d;
  stroke:#1a1a1a;
  stroke-width:1;
  opacity: 0;
  transform: scale(0.5);
  transform-origin: 100px 100px;
  animation: centerReveal 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  animation-delay: 0.4s;
}

@keyframes centerReveal {
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* LINKS CON REVELADO EN CASCADA */
.links{
  width:100%;
  border-top:1px solid #1a1a1a;
}

.link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid #1a1a1a;
  text-decoration:none;
  color:#aaa;
  font-size:16px;
  letter-spacing:0.04em;
  position: relative;
  transition: color 0.12s;
  opacity: 0;
  transform: translateY(12px);
  animation: linkReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes linkReveal {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.link:nth-child(1) { animation-delay: 1.2s; }
.link:nth-child(2) { animation-delay: 1.35s; }
.link:nth-child(3) { animation-delay: 1.5s; }

.link::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0;
  width: 100%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transform: scaleX(0);
  transition: transform 0.3s ease;
}
.link:hover::after {
  transform: scaleX(1);
}

.link:hover{color:#fff}
.link:hover .arr{color:#fff}

.link-left{
  display:flex;
  align-items:center;
  gap:10px;
  transition: transform 0.2s ease;
}
.link:hover .link-left {
  transform: translateX(4px);
}

.arr{color:#333;font-size:15px;transition:color 0.12s, transform 0.2s ease}
.link:hover .arr {
  transform: translateX(2px);
}

/* SPONSOR */
.sponsor-block{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding-top:20px;
  margin-top:6px;
  opacity: 0;
  animation: subtitleReveal 1s ease forwards;
  animation-delay: 1.7s;
}
.sp-label{
  font-size:13px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:#444;
  font-style:normal;
  border-bottom:1px solid #333;
  padding-bottom:3px;
}
.sponsor{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  width:auto;
  transition:opacity 0.2s;
  outline:none;
  user-select:none;
}
.sponsor:hover{opacity:1}
.sp-img{
  height:80px;
  display:block;
  filter:grayscale(1) brightness(1.5);
  opacity:0.5;
  transition:opacity 0.2s, transform 0.2s, filter 0.2s;
  object-fit:contain;
}
.sponsor:hover .sp-img{
  opacity:1;
  transform:scale(1.08);
  filter:grayscale(0) brightness(1.1);
}

@keyframes sliceAssemble {
  from {
    opacity: 0;
    transform: translate(var(--mx), var(--my)) scale(0.6) rotate(-20deg);
  }
  to {
    opacity: 1;
    transform: translate(0, 0) scale(1) rotate(0deg);
  }
}
</style>
</head>

let audioCtx = null;

function preWarmAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  window.removeEventListener('click', preWarmAudio);
  window.removeEventListener('touchstart', preWarmAudio);
}
window.addEventListener('click', preWarmAudio);
window.addEventListener('touchstart', preWarmAudio);

function playTickSound() {
  try {
    if (!audioCtx || audioCtx.state === 'suspended') {
      return; 
    }
    
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.07);
    
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(320, now);
    filter.frequency.exponentialRampToValueAtTime(100, now + 0.07);
    
    gainNode.gain.setValueAtTime(0, now);
    gainNode.gain.linearRampToValueAtTime(0.25, now + 0.001);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
    
    osc.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.start(now);
    osc.stop(now + 0.07);
  } catch (e) {}
}

const svg = document.getElementById('pizzaSVG');

// Fondo negro explícito dentro del SVG para mobile
const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
bgRect.setAttribute('width', '200');
bgRect.setAttribute('height', '200');
bgRect.setAttribute('fill', '#080808');
svg.appendChild(bgRect);

const cx = 100, cy = 100;
const outerR = 95, innerR = 30;
const n = socials.length;
const angleStep = (2 * Math.PI) / n;
const startOffset = -Math.PI / 2;

function polar(r, angle) {
  return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
}

function slicePath(i) {
  const a1 = startOffset + i * angleStep;
  const a2 = a1 + angleStep;
  const gap = 0.04;
  const [ox1, oy1] = polar(outerR, a1 + gap);
  const [ox2, oy2] = polar(outerR, a2 - gap);
  const [ix1, iy1] = polar(innerR, a2 - gap);
  const [ix2, iy2] = polar(innerR, a1 + gap);
  return `M ${ox1} ${oy1} A ${outerR} ${outerR} 0 0 1 ${ox2} ${oy2} L ${ix1} ${iy1} A ${innerR} ${innerR} 0 0 0 ${ix2} ${iy2} Z`;
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

socials.forEach((s, i) => {
  const a = startOffset + i * angleStep + angleStep / 2;
  const iconR = (outerR + innerR) / 2;
  const [iconX, iconY] = polar(iconR, a);
  const iconSize = 16;

  // SOLUCIÓN: Creamos una etiqueta nativa de enlace SVG
  const anchor = document.createElementNS('http://www.w3.org/2000/svg', 'a');
  anchor.setAttribute('href', s.url);
  anchor.setAttribute('target', '_blank');

  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'slice');
  g.style.cursor = 'pointer';

  const moveDistance = 45; 
  const mx = Math.cos(a) * moveDistance;
  const my = Math.sin(a) * moveDistance;
  g.style.setProperty('--mx', `${mx}px`);
  g.style.setProperty('--my', `${my}px`);
  
  g.style.opacity = '0';
  g.style.animation = `sliceAssemble 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards`;
  g.style.animationDelay = `${0.5 + (i * 0.08)}s`;

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', 'bg');
  path.setAttribute('d', slicePath(i));
  path.setAttribute('fill', '#111');
  path.setAttribute('stroke', '#080808');
  path.setAttribute('stroke-width', '3');

  const iconG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const scale = iconSize / 24;
  iconG.setAttribute('transform', `translate(${iconX - iconSize/2}, ${iconY - iconSize/2}) scale(${scale})`);
  iconG.style.pointerEvents = 'none';

  const iconPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  iconPath.setAttribute('d', s.iconPath);
  iconPath.setAttribute('class', 'icon-path');
  iconPath.setAttribute('fill', '#2a2a2a');

  iconG.appendChild(iconPath);
  g.appendChild(path);
  g.appendChild(iconG);

  anchor.addEventListener('mouseenter', () => {
    playTickSound();
    const rgb = hexToRgb(s.color);
    path.setAttribute('fill', `rgba(${rgb},0.18)`);
    path.setAttribute('stroke', `rgba(${rgb},0.4)`);
    iconPath.setAttribute('fill', s.color);
    g.style.transform = `translate(${Math.cos(a) * 3.5}px, ${Math.sin(a) * 3.5}px)`;
    if (avatarImg) avatarImg.style.opacity = '1';
  });
  
  anchor.addEventListener('mouseleave', () => {
    path.setAttribute('fill', '#111');
    path.setAttribute('stroke', '#080808');
    iconPath.setAttribute('fill', '#2a2a2a');
    g.style.transform = 'translate(0px, 0px)';
    if (avatarImg) avatarImg.style.opacity = '0.2';
  });

  anchor.addEventListener('touchstart', (e) => {
    playTickSound();
    const rgb = hexToRgb(s.color);
    path.setAttribute('fill', `rgba(${rgb},0.18)`);
    path.setAttribute('stroke', `rgba(${rgb},0.4)`);
    iconPath.setAttribute('fill', s.color);
    if (avatarImg) avatarImg.style.opacity = '1';
  }, { passive: true });

  anchor.addEventListener('touchend', () => {
    setTimeout(() => {
      path.setAttribute('fill', '#111');
      path.setAttribute('stroke', '#080808');
      iconPath.setAttribute('fill', '#2a2a2a');
      if (avatarImg) avatarImg.style.opacity = '0.2';
    }, 300);
  }, { passive: true });

  // Metemos el grupo visual dentro del enlace, y el enlace al SVG
  anchor.appendChild(g);
  svg.appendChild(anchor);
});

const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
circ.setAttribute('cx', cx);
circ.setAttribute('cy', cy);
circ.setAttribute('r', innerR);
circ.setAttribute('class', 'center-circle');
svg.appendChild(circ);

const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
const clipPath = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
clipPath.setAttribute('id', 'avatarClip');
const clipCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
clipCircle.setAttribute('cx', cx);
clipCircle.setAttribute('cy', cy);
clipCircle.setAttribute('r', innerR - 2);
clipPath.appendChild(clipCircle);
defs.appendChild(clipPath);
svg.appendChild(defs);

const avatarImg = document.createElementNS('http://www.w3.org/2000/svg', 'image');
avatarImg.setAttribute('href', 'https://donfenor.github.io/stream/cryfenor2.png');
avatarImg.setAttribute('x', cx - (innerR - 2));
avatarImg.setAttribute('y', cy - (innerR - 2));
